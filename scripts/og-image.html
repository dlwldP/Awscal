<!doctype html>
<!-- 링크 미리보기 이미지(assets/og.png, 1200×630) 원본.
     다시 만들 때: 브라우저로 이 파일을 1200×630 크기로 열고 화면을 캡처해 assets/og.png로 저장한다. -->
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; background: #13294b; font-family: "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Noto Sans CJK KR", sans-serif; color: #fff; display: flex; align-items: center; padding: 0 80px; gap: 56px; word-break: keep-all; }
  .left { flex: 1; }
  .logo { display: flex; align-items: center; gap: 14px; font-size: 30px; font-weight: 800; margin-bottom: 32px; letter-spacing: -0.02em; }
  .logo svg { border-radius: 10px; box-shadow: 0 0 0 2px rgba(255,255,255,.15); }
  h1 { font-size: 64px; line-height: 1.25; font-weight: 800; letter-spacing: -0.03em; }
  h1 em { font-style: normal; color: #ff9900; }
  p { margin-top: 24px; font-size: 27px; color: #c4d0e4; line-height: 1.5; }
  .card { width: 410px; background: #fff; color: #101828; border-radius: 24px; padding: 34px; box-shadow: 0 24px 60px rgba(0,0,0,.35); }
  .label { color: #5d6b7e; font-size: 21px; }
  .pick { color: #a85a00; font-size: 20px; font-weight: 800; margin-top: 4px; }
  .big { font-size: 52px; font-weight: 800; margin: 2px 0 22px; letter-spacing: -0.03em; }
  .big small { font-size: 24px; color: #5d6b7e; font-weight: 600; }
  .row { display: flex; justify-content: space-between; font-size: 21px; margin-top: 14px; }
  .bar { height: 10px; border-radius: 99px; background: #eaf0f8; margin-top: 8px; overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 99px; background: #c3cee0; }
  .best i { background: #13294b; } .best span:last-child { color: #13294b; font-weight: 800; }
</style>
</head>
<body>
  <div class="left">
    <div class="logo"><svg width="44" height="44" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#0b1b33"/><rect x="7" y="17" width="4.5" height="8" rx="1.2" fill="#fff"/><rect x="13.75" y="12" width="4.5" height="13" rx="1.2" fill="#fff"/><rect x="20.5" y="7" width="4.5" height="18" rx="1.2" fill="#ff9900"/></svg>AWS 얼마야?</div>
    <h1>AWS, 한 달에<br><em>얼마</em> 나올까요?</h1>
    <p>만들고 싶은 걸 고르면 필요한 구성과<br>월 비용을 원화로 비교해드려요. 숨은 비용까지.</p>
  </div>
  <div class="card">
    <div class="label">백엔드 웹앱 · 개인용 · 서울</div>
    <div class="pick">처음이라면 Lightsail</div>
    <div class="big">약 10,780원<small> / 월</small></div>
    <div class="row best"><span>Lightsail</span><span>10,780원</span></div><div class="bar best"><i style="width:20%"></i></div>
    <div class="row"><span>EC2 + RDS</span><span>53,232원</span></div><div class="bar"><i style="width:97%"></i></div>
    <div class="row"><span>Fargate + RDS</span><span>54,689원</span></div><div class="bar"><i style="width:100%"></i></div>
  </div>
</body>
</html>
