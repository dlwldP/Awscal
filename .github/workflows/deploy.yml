# main에 푸시하면 테스트 후 GitHub Pages에 배포한다.
# 가격 갱신 워크플로(update-prices.yml)에서도 재사용한다.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }} # 가격 갱신 커밋 직후 호출될 때도 최신 main을 받는다
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: 가격 수집 스크립트 테스트
        run: python3 -m unittest discover -s tests -p "test_*.py"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 배포할 파일 모으기 + 검색용 소개 페이지 생성
        run: |
          mkdir _site
          cp -r index.html css js data assets _site/
          node scripts/build-pages.js _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
