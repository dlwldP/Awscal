# 주 1회 AWS Price List Bulk API에서 가격을 다시 받아 data/prices.json을 갱신하고 배포한다.
# 수집 스크립트나 테스트가 실패하면 커밋하지 않으므로 기존 가격이 그대로 유지된다.
name: Update prices

on:
  schedule:
    - cron: "0 0 * * 1" # 매주 월요일 09:00 KST
  workflow_dispatch:

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 가격 수집
        run: python3 scripts/fetch_prices.py
      - name: 테스트
        run: |
          npm test
          python3 -m unittest discover -s tests -p "test_*.py"
      - name: 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.json data/price-changes.json
          git diff --cached --quiet && { echo "변경 없음"; exit 0; }
          changed=$(python3 -c "import json; print(len(json.load(open('data/price-changes.json'))['changes']))")
          git commit -m "chore: 가격 데이터 자동 갱신 ($(date -u +%Y-%m-%d), 단가 변동 ${changed}건)"
          git push

  # GITHUB_TOKEN으로 만든 푸시는 다른 워크플로를 트리거하지 않으므로 배포를 직접 호출한다.
  deploy:
    needs: update
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
